# Perfil de desenvolvimento local — banco Postgres rodando na maquina do desenvolvedor.
# Sobrescreva via variaveis de ambiente (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET) em vez de editar valores aqui.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medsafe_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Segredo de assinatura dos tokens JWT — valor fixo SO para desenvolvimento local.
app.jwt.secret=${JWT_SECRET:segredo-apenas-para-desenvolvimento-local-0123456789}
