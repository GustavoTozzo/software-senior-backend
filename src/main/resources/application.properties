spring.application.name=software-senior-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Validade do token de login (formato de duracao do Spring: 7d, 12h...). O segredo (app.jwt.secret)
# e definido por perfil: em producao deve vir da variavel de ambiente JWT_SECRET.
app.jwt.expiration=${JWT_EXPIRATION:7d}
